name: Automation Test CI/CD Pipeline

on:
  # 1. Trigger automatically when developers or QA push code
  push:
    branches: [ main, master, develop ]
  
  # 2. Trigger on pull requests to gate code merges
  pull_request:
    branches: [ main, master ]

  # 3. Scheduled Trigger: Runs nightly regression every day at 02:00 AM UTC
  schedule:
    - cron: '0 2 * * *'

  # 4. Manual on-demand execution with parameter choices
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite marker to execute'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - regression
          - ui
          - api
      browser:
        description: 'Browser engine'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit

jobs:
  test-execution:
    name: Execute Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 3. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Install Playwright System Browsers & Dependencies
        run: |
          playwright install --with-deps chromium

      - name: 5. Execute Pytest Test Suite
        env:
          HEADLESS: "True"
          BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
        run: |
          if [ "${{ github.event.inputs.test_suite }}" != "" ] && [ "${{ github.event.inputs.test_suite }}" != "all" ]; then
            pytest -m "${{ github.event.inputs.test_suite }}" --html=reports/report.html --self-contained-html
          else
            pytest --html=reports/report.html --self-contained-html
          fi

      - name: 6. Archive HTML Test Report & Failure Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-execution-report
          path: |
            reports/report.html
            reports/screenshots/
          retention-days: 14
